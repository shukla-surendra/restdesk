name: desktop

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["desktop/**", "src/restdesk/**", ".github/workflows/desktop.yml"]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Smoke test (dev mode)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke
      - name: Smoke test (dev mode)
        if: runner.os != 'Linux'
        run: npm run smoke
      - name: Build installers (unsigned)
        run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: restdesk-${{ runner.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: error
